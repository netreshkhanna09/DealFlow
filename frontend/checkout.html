<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Razorpay Payment Gateway (Test Mode) | DealFlow</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #030712;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(0, 102, 255, 0.22) 0px, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 194, 255, 0.15) 0px, transparent 50%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }
    .checkout-modal {
      background: rgba(10, 22, 46, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 194, 255, 0.35);
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 35px rgba(0, 102, 255, 0.3);
    }
    .rzp-header {
      background: linear-gradient(135deg, #0c2340 0%, #0066ff 100%);
      padding: 1.6rem;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .rzp-brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .rzp-logo {
      width: 40px;
      height: 40px;
      background: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #0066ff;
      font-size: 1.35rem;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }
    .rzp-title h3 {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0;
      color: #ffffff;
    }
    .rzp-title span {
      font-size: 0.78rem;
      opacity: 0.85;
      color: #bfdbfe;
    }
    .rzp-test-badge {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 0.3rem 0.7rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .rzp-body {
      padding: 1.6rem;
    }
    .amount-display {
      background: rgba(4, 9, 20, 0.85);
      border: 1px solid rgba(0, 102, 255, 0.25);
      border-radius: 14px;
      padding: 1.1rem;
      text-align: center;
      margin-bottom: 1.4rem;
    }
    .amount-label {
      font-size: 0.82rem;
      color: #94a3b8;
    }
    .amount-value {
      font-size: 2rem;
      font-weight: 900;
      color: #38bdf8;
      margin-top: 0.25rem;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .payment-methods {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 1.6rem;
    }
    .method-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.95rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.25s;
    }
    .method-card:hover, .method-card.selected {
      border-color: #00c2ff;
      background: rgba(0, 194, 255, 0.1);
      box-shadow: 0 0 15px rgba(0, 194, 255, 0.2);
    }
    .method-info {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .method-icon {
      font-size: 1.4rem;
    }
    .method-name {
      font-weight: 700;
      font-size: 0.92rem;
      color: #f8fafc;
    }
    .pay-now-btn {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      color: #ffffff;
      padding: 1rem;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.45);
      transition: all 0.25s;
    }
    .pay-now-btn:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.65);
      transform: translateY(-1px);
    }
    .success-screen {
      text-align: center;
      padding: 2.2rem 1rem;
    }
    .success-icon {
      width: 68px;
      height: 68px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin: 0 auto 1.1rem;
      border: 2px solid #34d399;
      box-shadow: 0 0 20px rgba(52, 211, 153, 0.5);
    }
  </style>
</head>
<body>

  <div class="checkout-modal">
    <!-- Header -->
    <div class="rzp-header">
      <div class="rzp-brand">
        <div class="rzp-logo">R</div>
        <div class="rzp-title">
          <h3>Razorpay</h3>
          <span>DealFlow Authorized Merchant</span>
        </div>
      </div>
      <span class="rzp-test-badge">TEST MODE</span>
    </div>

    <!-- Body -->
    <div class="rzp-body" id="checkoutContent">
      <div class="amount-display">
        <div class="amount-label" id="descText">Negotiated Agent Purchase</div>
        <div class="amount-value" id="amountText">₹0.00</div>
        <div style="font-size: 0.75rem; color: #64748b; margin-top: 0.35rem;" id="linkIdText">Link ID: --</div>
      </div>

      <div class="payment-methods">
        <div class="method-card selected" onclick="selectMethod(this, 'card')">
          <div class="method-info">
            <span class="method-icon">💳</span>
            <div>
              <div class="method-name">Razorpay Test Card</div>
              <div style="font-size: 0.75rem; color: #94a3b8;">4111 •••• •••• 1111</div>
            </div>
          </div>
          <span style="color: #38bdf8;">✓</span>
        </div>

        <div class="method-card" onclick="selectMethod(this, 'upi')">
          <div class="method-info">
            <span class="method-icon">📱</span>
            <div>
              <div class="method-name">Razorpay Test UPI / QR</div>
              <div style="font-size: 0.75rem; color: #94a3b8;">success@razorpay</div>
            </div>
          </div>
        </div>
      </div>

      <button id="paySubmitBtn" class="pay-now-btn" onclick="executeSelectedPayment()">
        Pay Now via Razorpay
      </button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const amount = params.get('amount') || '0.00';
    const desc = params.get('desc') || 'DealFlow Agent Purchase';
    const linkId = params.get('link_id') || 'plink_test';

    document.getElementById('amountText').innerText = `₹${parseFloat(amount).toFixed(2)}`;
    document.getElementById('descText').innerText = decodeURIComponent(desc);
    document.getElementById('linkIdText').innerText = `Payment Link ID: ${linkId}`;

    function selectMethod(el, method) {
      document.querySelectorAll('.method-card').forEach(c => {
        c.classList.remove('selected');
        c.querySelector('span:last-child')?.remove();
      });
      el.classList.add('selected');
      const check = document.createElement('span');
      check.style.color = '#38bdf8';
      check.innerText = '✓';
      el.appendChild(check);
    }

    function executeSelectedPayment() {
      processPayment();
    }

    function processPayment() {
      const content = document.getElementById('checkoutContent');
      content.innerHTML = `
        <div style="text-align: center; padding: 3.2rem 1rem;">
          <div class="pulse-dot" style="width: 26px; height: 26px; margin: 0 auto 1.2rem; background: #00c2ff; box-shadow: 0 0 20px #00c2ff;"></div>
          <div style="font-size: 1.15rem; font-weight: 800; color: #f8fafc;">Authorizing with Razorpay Gateway...</div>
          <div style="font-size: 0.84rem; color: #94a3b8; margin-top: 0.5rem;">Token verification in progress</div>
        </div>
      `;

      setTimeout(() => {
        const payId = 'pay_' + Math.random().toString(36).substring(2, 12);
        content.innerHTML = `
          <div class="success-screen">
            <div class="success-icon">✓</div>
            <h3 style="font-size: 1.45rem; color: #34d399; margin-bottom: 0.5rem;">Payment Successful!</h3>
            <p style="font-size: 0.9rem; color: #cbd5e1;">Razorpay Payment ID: <strong>${payId}</strong></p>
            <div style="background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.35); padding: 1.1rem; border-radius: 12px; margin: 1.6rem 0; font-size: 0.88rem; color: #6ee7b7;">
              Captured ₹${parseFloat(amount).toFixed(2)} via Razorpay Test Mode. Transaction logged to DealFlow SQLite database.
            </div>
            <button class="pay-now-btn" onclick="window.location.href='/'">
              Return to DealFlow Control Center ➔
            </button>
          </div>
        `;
      }, 1200);
    }
  </script>
</body>
</html>
